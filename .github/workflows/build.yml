name: Build_nokia_xg-040g-md-ubi
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: 0 8 * * 1

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  BASE_CONFIG: configs/an7581.config
  CONFIG_FILE: my.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_SYM: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y '^dotnet-.*' '^mongodb-.*' '^mysql-.*' php.* azure-cli \
          google-cloud-sdk google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean || true
        echo "Removing large directories"
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android
        df -h
        sudo -E apt-get -qq update
        # PonWrt README 依赖清单（比 P3TERX 老模板多了 ninja-build/lld/llvm/libgmp3-dev 等）
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge || true
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -h

    - name: Clone PonWrt source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH ponwrt
        ln -sf /workdir/ponwrt $GITHUB_WORKSPACE/openwrt

    - name: Enable build ccache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'ponwrt-an7581-xg040gmd'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        # 用仓库根目录自带的 feeds.conf.default（已含 pon_drivers/pon_userspace/istore）
        if [ -e "$FEEDS_CONF" ]; then
          mv -f "$FEEDS_CONF" openwrt/feeds.conf.default
          echo "已使用仓库自带的 feeds.conf.default"
        fi
        if [ -e files ]; then mv files openwrt/files; fi
        chmod +x $DIY_P1_SH 2>/dev/null || true
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && $GITHUB_WORKSPACE/$DIY_P1_SH || true

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a
        # PON 两个私有源是硬依赖
        for f in pon_drivers pon_userspace; do
          if [ ! -d "feeds/$f" ]; then
            echo "::error::feeds/$f 不存在，feeds.conf.default 必须包含该源"
            exit 1
          fi
        done

    - name: 配置：官方基线 → 裁剪单设备 → 叠加差异项 → 断言 PON / iStore
      run: |
        cd openwrt

        # 1) 官方基线，PON 驱动、单板 DTS、内核选项都齐
        cp -f "$BASE_CONFIG" .config

        # 2) 裁成只留 Nokia XG-040G-MD (UBI)
        sed -i -E 's|^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(.+)=y$|# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set|' .config
        sed -i -E 's|^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi is not set$|CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y|' .config

        # 3) 叠加差异项：先删同名旧行再追加，避免重复符号
        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sym=""
            case "$line" in
              \#*)
                sym=$(printf '%s' "$line" | sed -nE 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/p')
                ;;
              *)
                sym=${line%%=*}
                ;;
            esac
            case "$sym" in CONFIG_*) ;; *) continue ;; esac
            sed -i -E "/^${sym}=/d; /^# ${sym} is not set$/d" .config
            printf '%s\n' "$line" >> .config
          done < "$GITHUB_WORKSPACE/$CONFIG_FILE"
        else
          echo "::warning::没找到 $CONFIG_FILE，只使用官方基线"
        fi

        # 4) 补齐依赖
        make defconfig

        # 5) 设备断言
        if ! grep -q "^${DEVICE_SYM}=y" .config; then
          echo "::error::设备符号 ${DEVICE_SYM} 未生效，会回落 EVB"
          grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config || true
          exit 1
        fi

        # 6) PON 断言：被静默丢弃时立刻失败
        MISS=""
        for p in kmod-airoha-xpon kmod-airoha-pon-frontend kmod-airoha-en7572 airoha-ponctl airoha-pond fitblk; do
          grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config || MISS="$MISS $p"
        done
        if [ -n "$MISS" ]; then
          echo "::error::PON 组件未生效:$MISS（检查 pon_drivers/pon_userspace feeds）"
          exit 1
        fi

        echo "==================== 目标设备 ===================="
        grep -E '^CONFIG_TARGET_(MULTI_PROFILE|DEVICE)' .config || true
        echo "==================== 可选功能解析情况 ===================="
        for p in luci-app-pon luci-i18n-pon-zh-cn airoha-pon-debug luci-app-iptv zerotier \
                 luci-app-zerotier luci-app-wol ddns-go luci-app-ddns-go socat \
                 luci-theme-argon kmod-usb-storage kmod-fs-ext4 luci-app-store luci-app-filebrowser; do
          if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
            echo "  [ OK ]   $p"
          else
            echo "  [MISS]   $p  <- 符号不存在或依赖未满足，已被静默丢弃"
          fi
        done
        echo "===================================================="

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        # 真编译镜像（原写法 make package/index checksum 只生成索引）
        make -j4 V=s || make -j1 V=s

        shopt -s nullglob
        imgs=(bin/targets/airoha/an7581/*sysupgrade*)
        manifests=(bin/targets/airoha/an7581/*.manifest)
        if [ ${#imgs[@]} -eq 0 ]; then
          echo "::error::没有生成 sysupgrade 固件"
          exit 1
        fi
        if [ ${#manifests[@]} -eq 0 ]; then
          echo "::error::没有生成 .manifest，无法校验 PON 是否进包"
          exit 1
        fi

        M="${manifests[0]}"
        echo "使用 manifest: $M"
        MISS=""
        for p in kmod-airoha-xpon kmod-airoha-en7572 airoha-pond airoha-ponctl fitblk; do
          grep -qE "^${p} " "$M" || MISS="$MISS $p"
        done
        if [ -n "$MISS" ]; then
          echo "::error::固件内缺少 PON 组件:$MISS"
          exit 1
        fi
        echo "PON 校验通过：固件内已含 airoha-pond / kmod-airoha-xpon 等"

        echo "status=success" >> $GITHUB_OUTPUT
        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | head -n1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "==================== 生成的固件 ===================="
        ls -lh "${imgs[@]}"
        echo "===================================================="

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: PonWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/airoha/an7581
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: PonWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      run: |
        echo "release_tag=PonWrt-XG-040G-MD-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && steps.compile.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --jq '.[] | select(.tag_name | startswith("PonWrt-XG-040G-MD-")) | .id' \
          | tail -n +6 | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}"
