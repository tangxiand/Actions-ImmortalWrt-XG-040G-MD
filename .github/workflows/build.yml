name: Build_nokia_xg-040g-md-ubi
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: 0 8 * * 1

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  BASE_CONFIG: configs/an7581.config
  CONFIG_FILE: my.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_SYM: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi
  # 直接从 package/ 克隆的第三方 LuCI 应用（socat / airoha-npu / OpenVPN 客户端）属"可选集成"：
  # true=没生效就 fail（约 10 分钟内出结果，省得白跑 2.5h）；
  # 改成 false = 只告警、继续出固件。GitHub 克隆失败时把它设为 false。
  REQUIRE_OPTIONAL: 'true'
  # iStore 应用商店：true=没集成就 fail（强制调试）；false=没集成只告警、继续出固件
  # （默认软失败，避免拖累 NPU/DoH/温度等核心功能；社区源偶发克隆失败不致命）。
  REQUIRE_ISTORE: 'false'
  # 工作流版本指纹：配置阶段会打印 BUILD_REV + my.config 的 sha256。
  # 用途：2026-11-10 曾因仓库里 build.yml 未同步（旧版仍把 luci-app-ddns 列进关键包
  # 硬断言），而 my.config 已关掉 DDNS，导致误报「关键包 luci-app-ddns 未生效」。
  # 下次先看日志里的指纹，即可确认 CI 跑的是不是最新文件。
  BUILD_REV: '2026-11-10b'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y '^dotnet-.*' '^mongodb-.*' '^mysql-.*' php.* azure-cli \
          google-cloud-sdk google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean || true
        echo "Removing large directories"
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android
        df -h
        sudo -E apt-get -qq update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge || true
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -h

    - name: Clone PonWrt source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH ponwrt
        ln -sf /workdir/ponwrt $GITHUB_WORKSPACE/openwrt

    - name: Enable build ccache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'ponwrt-an7581-xg040gmd'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then
          mv -f "$FEEDS_CONF" openwrt/feeds.conf.default
          echo "已使用仓库自带的 feeds.conf.default"
        fi
        if [ -e files ]; then mv files openwrt/files; fi
        chmod +x $DIY_P1_SH 2>/dev/null || true
        chmod +x $DIY_P2_SH 2>/dev/null || true
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && $GITHUB_WORKSPACE/$DIY_P1_SH || true
        [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ] && $GITHUB_WORKSPACE/$DIY_P2_SH || true

        # diy-part2.sh 调用时带了 || true 容错，这里显式校验产物，防止静默失效
        for f in files/usr/lib/pon-tempinfo/tempinfo \
                 files/etc/uci-defaults/97-pon-tempinfo \
                 files/etc/uci-defaults/98-fix-apk-repos \
                 files/etc/uci-defaults/99-npu-hw-offload; do
          [ -f "$f" ] || { echo "::error::自定义文件缺失: $f（diy-part2.sh 可能执行失败）"; exit 1; }
          sh -n "$f" || { echo "::error::自定义文件语法错误: $f"; exit 1; }
        done
        echo "OK: 4 个自定义 rootfs 文件校验通过"

        # OpenVPN 客户端包从 openwrt/luci 稳定分支单独取，确认 include 已改成 buildroot 可用路径
        if [ -f package/luci-app-openvpn/Makefile ]; then
          if grep -q 'feeds/luci/luci.mk' package/luci-app-openvpn/Makefile; then
            echo "OK: luci-app-openvpn 的 luci.mk include 已修正"
          else
            echo "::warning::luci-app-openvpn 的 luci.mk include 未修正（可能导致 defconfig 解析失败）"
          fi
        fi

    - name: Update feeds
      run: |
        cd openwrt
        if ! ./scripts/feeds update -a; then
          echo "::warning::feeds update -a 失败，改为逐源更新（单个可选源失败不致命）"
          while read -r kind name _ <&3; do
            case "$kind" in
              src-git|src-git-full|src-svn|src-link) ;;
              *) continue ;;
            esac
            echo "--- 更新源: $name ---"
            ./scripts/feeds update "$name" ||             echo "::warning::源 $name 更新失败，跳过"
          done 3< feeds.conf.default
        fi

        # iStore 源单独重试：GitHub 偶发限流/克隆失败会让 feeds/istore 为空、
        # 导致 luci-app-store 符号整体缺失（配置阶段断言失败）。单独重试 3 次兜底。
        for i in 1 2 3; do
          if [ -f "feeds/istore/luci/luci-app-store/Makefile" ]; then
            echo "  [ OK ] iStore 源已就位（检查 $i）"
            break
          fi
          echo "::warning::iStore 源尚未就位，第 $i 次重试 feeds update istore"
          ./scripts/feeds update istore || true
        done

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a || {
          echo "::warning::feeds install -a 未完全成功，重试一次"
          ./scripts/feeds install -a || true
        }
        for f in pon_drivers pon_userspace; do
          if [ ! -d "feeds/$f" ]; then
            echo "::error::feeds/$f 不存在，feeds.conf.default 必须包含该源"
            exit 1
          fi
        done
        # socat 图形界面 / NPU 状态页 / OpenVPN 客户端界面由 diy-part1.sh 直接克隆进 package/
        # （不走 feeds 索引），这里确认它们真的就位，早发现早告警
        for d in luci-app-socat luci-app-airoha-npu luci-app-openvpn; do
          if [ -f "package/$d/Makefile" ]; then
            echo "  [ OK ] package/$d/Makefile 已就位（diy-part1.sh 克隆成功）"
          else
            echo "::warning::package/$d/Makefile 不存在（diy-part1.sh 未成功克隆？）"
          fi
        done

        # iStore 来自 istore 源（feeds/istore），确认其关键包 Makefile 已就位（源加载成功才会存在）
        if [ -f "feeds/istore/luci/luci-app-store/Makefile" ]; then
          echo "  [ OK ] feeds/istore/luci/luci-app-store/Makefile 已就位（iStore 源加载成功）"
        else
          echo "::warning::feeds/istore/luci/luci-app-store/Makefile 不存在（istore 源未成功加载？）"
        fi

    - name: 配置：官方基线 → 裁剪单设备 → 叠加差异项 → 断言设备与关键包
      run: |
        cd openwrt

        # ---- 构建输入指纹：先确认 CI 跑的是不是最新文件 ----
        # 2026-11-10 教训：GitHub 仓库里的 build.yml 未同步（旧版仍把 luci-app-ddns
        # 列进关键包硬断言），而 my.config 已关掉 DDNS，于是必然误报
        # 「关键包 luci-app-ddns 未生效」。比对下面两行即可一眼定位版本不同步。
        echo "==================== 构建输入指纹 ===================="
        echo "BUILD_REV        = ${BUILD_REV}"
        echo "my.config sha256 = $(sha256sum "$GITHUB_WORKSPACE/$CONFIG_FILE" | cut -c1-16)"
        echo "本版关键包断言   = 不含任何 DDNS / ddns-go 包"
        echo "===================================================="

        cp -f "$BASE_CONFIG" .config

        sed -i -E 's|^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(.+)=y$|# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set|' .config
        sed -i -E 's|^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi is not set$|CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y|' .config

        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sym=""
            case "$line" in
              \#*)
                # 包名普遍带连字符（ddns-go / luci-app-ddns / px5g-wolfssl …），
                # 字符类必须含 '-'，否则 "is not set" 行会被整行跳过、基线里的 =y 删不掉。
                sym=$(printf '%s' "$line" | sed -nE 's/^# (CONFIG_[A-Za-z0-9_-]+) is not set$/\1/p')
                ;;
              *)
                sym=${line%%=*}
                ;;
            esac
            case "$sym" in CONFIG_*) ;; *) continue ;; esac
            sed -i -E "/^${sym}=/d; /^# ${sym} is not set$/d" .config
            printf '%s\n' "$line" >> .config
          done < "$GITHUB_WORKSPACE/$CONFIG_FILE"
        else
          echo "::warning::没找到 $CONFIG_FILE，只使用官方基线"
        fi

        make defconfig

        fail=0

        # ---------- 1) 设备符号 ----------
        if ! grep -q "^${DEVICE_SYM}=y" .config; then
          echo "::error::设备符号 ${DEVICE_SYM} 未生效，会回落 EVB"
          grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config || true
          fail=1
        fi

        # ---------- 2) 关键包（缺了固件就白编）----------
        # 【DDNS 严禁加入本列表】DDNS / ddns-go 已于 2026-11-10 彻底移除。
        # 旧版 workflow 把 luci-app-ddns 列在这里；一旦 my.config 关掉 DDNS，
        # 就必然报「关键包 luci-app-ddns 未生效」并提前终止。看到该报错 =
        # GitHub 仓库里的 build.yml 不是最新版，先同步文件，不要改配置去迁就它。
        for p in airoha-pond airoha-ponctl kmod-airoha-xpon kmod-airoha-en7572 \
                 px5g-mbedtls jsonfilter \
                 openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server \
                 airoha-en7581-npu-firmware kmod-nft-offload \
                 https-dns-proxy luci-app-https-dns-proxy; do
          if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
            echo "  [ OK ]   关键包 $p"
          else
            echo "::error::关键包 $p 未生效（符号不存在或依赖未满足）"
            fail=1
          fi
        done

        # ---------- 2b) DDNS：按要求「不要了，直接注释掉」，整段停用 ----------
        # 2026-11-10 用户明确「ddns 我可以不要，直接注释掉吧」。配置阶段对 DDNS
        # 零断言、零告警、零诊断输出，杜绝旧文件混入时的误导性提示。
        # 真正的「不要 DDNS」由 my.config 的 9 条 `# CONFIG_PACKAGE_* is not set` 实现：
        #   它们是【取消开关】，长得像注释但不能删——删了基线 configs/an7581.config
        #   里的同名 =y 行就会让 DDNS 重新进固件。
        # 原检查代码（保留备查，已全部注释，不再执行）：
        #   DDNS_LEFT=""
        #   for p in ddns-go luci-app-ddns-go ddns-scripts luci-app-ddns; do
        #     grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config && DDNS_LEFT="$DDNS_LEFT $p"
        #   done
        #   if [ -n "$DDNS_LEFT" ]; then
        #     echo "::warning::DDNS 相关包仍被选中:$DDNS_LEFT"
        #   else
        #     echo "  [ OK ]   DDNS / DDNS-Go 已全部移除"
        #   fi

        # ---------- 2c) apk 软件源：4 个本地 feed 设为 m，编译期注释掉 404 源 ----------
        # scripts/feeds 的 feed_config(): "Say M to add the feed commented out."
        # include/feeds.mk 的 FeedSourcesAppendAPK: =m 时输出 "# %U/.../<feed>/packages.adb"
        for f in pon_drivers pon_userspace istore video; do
          if grep -qE "^CONFIG_FEED_${f}=m$" .config; then
            echo "  [ OK ]   CONFIG_FEED_${f}=m（该源在 distfeeds.list 中被注释，不产生 404）"
          else
            echo "::warning::CONFIG_FEED_${f} 未生效为 m（首启 98-fix-apk-repos 仍会兜底清理）"
          fi
        done

        # ---------- 3) socat 图形界面 / NPU 状态页 / OpenVPN 客户端（第三方 package/ 包）----------
        OPT_MISS=""
        for p in luci-app-socat luci-app-airoha-npu luci-app-openvpn; do
          grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config || OPT_MISS="$OPT_MISS $p"
        done
        if [ -n "$OPT_MISS" ]; then
          echo "::group::第三方 package/ 包依赖诊断"
          for p in luci-app-socat socat luci-compat luci-lua-runtime uhttpd-mod-lua \
                   luci-app-airoha-npu luci-base luci-app-openvpn openvpn-openssl; do
            if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
              echo "  [ OK ] $p"
            else
              echo "  [MISS] $p"
            fi
          done
          echo "::endgroup::"
            if [ "${REQUIRE_OPTIONAL}" = "true" ]; then
            echo "::error::第三方 package/ 包未生效:$OPT_MISS（把 build.yml 里 REQUIRE_OPTIONAL 改成 false 可跳过；或检查 diy-part1.sh 是否成功克隆 luci-app-socat / luci-app-airoha-npu / luci-app-openvpn）"
            fail=1
          else
            echo "::warning::第三方 package/ 包未生效:$OPT_MISS（继续编译）"
          fi
        fi

        # ---------- 4) iStore 应用商店（社区源，软失败）----------
        if grep -qE "^CONFIG_PACKAGE_luci-app-store=[ym]$" .config; then
          echo "  [ OK ]   iStore: luci-app-store 已生效"
        else
          echo "::group::iStore 集成诊断"
          if [ -f "feeds/istore/luci/luci-app-store/Makefile" ]; then
            echo "  [feed OK] feeds/istore/luci/luci-app-store/Makefile 存在（源已加载）"
            echo "  -> 符号被 defconfig 丢弃，通常是依赖未满足。检查关键依赖："
            for d in curl tar libuci-lua mount-utils luci-lib-taskd luci-lib-xterm taskd luci-compat; do
              if grep -qE "^CONFIG_PACKAGE_${d}=[ym]$" .config; then
                echo "    [ OK ] $d"
              else
                echo "    [MISS] $d  <- 可能截断 iStore 依赖链"
              fi
            done
          else
            echo "  [feed 缺失] feeds/istore/luci/luci-app-store/Makefile 不存在（istore 源未成功加载/克隆失败）"
          fi
          echo "::endgroup::"
          if [ "${REQUIRE_ISTORE}" = "true" ]; then
            echo "::error::iStore luci-app-store 未生效（把 build.yml 里 REQUIRE_ISTORE 改成 false 可跳过）"
            fail=1
          else
            echo "::warning::iStore luci-app-store 未生效，已跳过（不影响 NPU/DoH/温度等核心功能）"
          fi
        fi

        echo "==================== 目标设备 ===================="
        grep -E '^CONFIG_TARGET_(MULTI_PROFILE|DEVICE)' .config || true

        echo "==================== 功能解析情况 ===================="
        for p in luci-app-pon luci-i18n-pon-zh-cn airoha-pon-debug \
                 luci-app-iptv zerotier luci-app-zerotier luci-app-wol \
                 socat luci-app-socat luci-app-airoha-npu luci-i18n-airoha-npu-zh-cn px5g-mbedtls \
                 openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server \
                 luci-app-openvpn luci-i18n-openvpn-zh-cn kmod-tun jsonfilter \
                 airoha-en7581-npu-firmware kmod-nft-offload \
                 https-dns-proxy luci-app-https-dns-proxy luci-app-store \
                 luci-theme-argon kmod-usb-storage kmod-fs-ext4 \
                 luci-app-filebrowser \
                 luci-app-package-manager ca-bundle; do
          if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
            echo "  [ OK ]   $p"
          else
            echo "  [MISS]   $p  <- 符号不存在或依赖未满足，已被静默丢弃"
          fi
        done
        echo "===================================================="

        if [ "$fail" -ne 0 ]; then
          echo "::error::配置阶段断言未通过，提前终止（省掉 2 小时空编译）"
          exit 1
        fi
        echo "配置阶段断言全部通过"

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j4 V=s || make -j1 V=s

        shopt -s nullglob
        imgs=(bin/targets/airoha/an7581/*sysupgrade*)
        ls -lh bin/targets/airoha/an7581/ || true
        if [ ${#imgs[@]} -eq 0 ]; then
          echo "::error::没有生成 sysupgrade 固件"
          exit 1
        fi

        # 只取本设备的 manifest，别随手抓第一个
        M=""
        for f in bin/targets/airoha/an7581/*.manifest; do
          case "$f" in *nokia_xg-040g-md-ubi*) M="$f"; break;; esac
        done
        if [ -z "$M" ]; then
          M=$(ls bin/targets/airoha/an7581/*.manifest 2>/dev/null | head -n1 || true)
        fi

        {
          echo "=== 生成的文件 ==="
          ls -lh bin/targets/airoha/an7581/
          echo
          echo "=== manifest: ${M:-（无）} ==="
          if [ -n "$M" ]; then
            echo "--- pon / airoha / fit 相关行 ---"
            grep -inE 'fitblk|fit-check|pon|airoha' "$M" || echo "(无匹配行)"
            echo "--- openvpn / socat / px5g / store / taskd 相关行 ---"
            grep -inE 'openvpn|socat|px5g|store|taskd|ca-bundle|ca-certificates' "$M" || echo "(无匹配行)"
          fi
          echo
          echo "--- targets/packages 里 pon / fit 相关包 ---"
          ls bin/targets/airoha/an7581/packages/ 2>/dev/null | grep -iE 'fitblk|pon|airoha' || echo "(无匹配)"
        } | tee /tmp/pon-report.txt

        # 硬校验：4 个 PON 核心件必须在 manifest 里
        if [ -n "$M" ]; then
          HARD_MISS=""
          for p in airoha-pond airoha-ponctl kmod-airoha-xpon kmod-airoha-en7572; do
            grep -qE "^${p}([[:space:]]|-)" "$M" || HARD_MISS="$HARD_MISS $p"
          done
          if [ -n "$HARD_MISS" ]; then
            echo "::error::固件内缺少 PON 核心组件:$HARD_MISS"
            exit 1
          fi
          # 软校验：fitblk 是 HIDDEN:=1 的基础包，manifest 可能不列，不作为失败条件
          if grep -qE '^fitblk([[:space:]]|-)' "$M"; then
            echo "fitblk：已在 manifest 中"
          else
            echo "::warning::manifest 未列出 fitblk（隐藏基础包，常见现象，不影响 PON）"
          fi
        else
          echo "::warning::没有 .manifest，跳过 PON 校验（镜像已生成，照常上传）"
        fi

        # 软校验：本次新增/确认的组件是否真进了镜像（只告警，不判失败）
        if [ -n "$M" ]; then
          for p in px5g-mbedtls jsonfilter socat \
                   luci-app-socat luci-app-airoha-npu luci-app-openvpn \
                   openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server kmod-tun \
                   airoha-en7581-npu-firmware kmod-nft-offload \
                   https-dns-proxy luci-app-https-dns-proxy luci-app-store \
                   ca-bundle luci-app-package-manager; do
            if grep -qE "^${p}([[:space:]]|-)" "$M"; then
              echo "  [进包] $p"
            else
              echo "::warning::manifest 未见 $p（配置阶段若为 OK，多半是版本号行格式不同，可用 pon-report 复核）"
            fi
          done
        fi

        echo "PON 核心组件校验通过"
        echo "status=success" >> $GITHUB_OUTPUT

        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | head -n1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "==================== 生成的固件 ===================="
        ls -lh "${imgs[@]}"
        echo "===================================================="

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload PON report
      uses: actions/upload-artifact@main
      if: always()
      with:
        name: pon-report${{ env.FILE_DATE }}
        path: /tmp/pon-report.txt

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: always() && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: PonWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        if-no-files-found: warn

    - name: Organize files
      id: organize
      if: always() && env.UPLOAD_FIRMWARE == 'true'
      run: |
        DIR=openwrt/bin/targets/airoha/an7581
        if [ ! -d "$DIR" ]; then
          echo "::warning::没有产物目录 $DIR"
          exit 0
        fi
        cd "$DIR"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: PonWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: warn

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=PonWrt-XG-040G-MD-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --jq '.[] | select(.tag_name | startswith("PonWrt-XG-040G-MD-")) | .id' \
          | tail -n +6 | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}"
