name: Build_nokia_xg-040g-md-ubi
on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: 0 8 * * 1

env:
  REPO_URL: https://github.com/pbs05/ponwrt.git
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  BASE_CONFIG: configs/an7581.config
  CONFIG_FILE: my.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai
  DEVICE_SYM: CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi
  # socat 图形界面属"可选集成"：true=没生效就 fail（约 10 分钟内出结果，省得白跑 2.5h）；
  # 改成 false = 只告警、继续出固件。第三方 socat 源出问题时把它设为 false。
  REQUIRE_OPTIONAL: 'true'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        df -h
        echo "Removing large packages"
        sudo apt-get remove -y '^dotnet-.*' '^mongodb-.*' '^mysql-.*' php.* azure-cli \
          google-cloud-sdk google-chrome-stable firefox powershell mono-devel libgl1-mesa-dri || true
        sudo apt-get autoremove -y || true
        sudo apt-get clean || true
        echo "Removing large directories"
        sudo rm -rf /usr/share/dotnet /usr/local/graalvm /usr/local/.ghcup \
          /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/android
        df -h
        sudo -E apt-get -qq update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo -E apt-get -qq autoremove --purge || true
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir
        df -h

    - name: Clone PonWrt source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH ponwrt
        ln -sf /workdir/ponwrt $GITHUB_WORKSPACE/openwrt

    - name: Enable build ccache
      uses: klever1988/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: 'ponwrt-an7581-xg040gmd'
        prefix: ${{ github.workspace }}/openwrt

    - name: Load custom feeds
      run: |
        if [ -e "$FEEDS_CONF" ]; then
          mv -f "$FEEDS_CONF" openwrt/feeds.conf.default
          echo "已使用仓库自带的 feeds.conf.default"
        fi
        if [ -e files ]; then mv files openwrt/files; fi
        chmod +x $DIY_P1_SH 2>/dev/null || true
        cd openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ] && $GITHUB_WORKSPACE/$DIY_P1_SH || true

    - name: Update feeds
      run: |
        cd openwrt
        if ! ./scripts/feeds update -a; then
          echo "::warning::feeds update -a 失败，改为逐源更新（单个可选源失败不致命）"
          while read -r kind name _ <&3; do
            case "$kind" in
              src-git|src-git-full|src-svn|src-link) ;;
              *) continue ;;
            esac
            echo "--- 更新源: $name ---"
            ./scripts/feeds update "$name" || echo "::warning::源 $name 更新失败，跳过"
          done 3< feeds.conf.default
        fi

    - name: Install feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a || {
          echo "::warning::feeds install -a 未完全成功，重试一次"
          ./scripts/feeds install -a || true
        }
        for f in pon_drivers pon_userspace; do
          if [ ! -d "feeds/$f" ]; then
            echo "::error::feeds/$f 不存在，feeds.conf.default 必须包含该源"
            exit 1
          fi
        done
        # socat 图形界面改由 diy-part1.sh 直接克隆进 package/（不再走 feeds 索引），
        # 这里确认它真的就位，早发现早告警
        if [ -f package/luci-app-socat/Makefile ]; then
          echo "  [ OK ] package/luci-app-socat/Makefile 已就位（diy-part1.sh 克隆成功）"
        else
          echo "::warning::package/luci-app-socat/Makefile 不存在（diy-part1.sh 未成功克隆？）"
        fi

    - name: 配置：官方基线 → 裁剪单设备 → 叠加差异项 → 断言设备与关键包
      run: |
        cd openwrt

        cp -f "$BASE_CONFIG" .config

        sed -i -E 's|^CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_(.+)=y$|# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_\1 is not set|' .config
        sed -i -E 's|^# CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi is not set$|CONFIG_TARGET_DEVICE_airoha_an7581_DEVICE_nokia_xg-040g-md-ubi=y|' .config

        if [ -f "$GITHUB_WORKSPACE/$CONFIG_FILE" ]; then
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            sym=""
            case "$line" in
              \#*)
                sym=$(printf '%s' "$line" | sed -nE 's/^# (CONFIG_[A-Za-z0-9_]+) is not set$/\1/p')
                ;;
              *)
                sym=${line%%=*}
                ;;
            esac
            case "$sym" in CONFIG_*) ;; *) continue ;; esac
            sed -i -E "/^${sym}=/d; /^# ${sym} is not set$/d" .config
            printf '%s\n' "$line" >> .config
          done < "$GITHUB_WORKSPACE/$CONFIG_FILE"
        else
          echo "::warning::没找到 $CONFIG_FILE，只使用官方基线"
        fi

        make defconfig

        fail=0

        # ---------- 1) 设备符号 ----------
        if ! grep -q "^${DEVICE_SYM}=y" .config; then
          echo "::error::设备符号 ${DEVICE_SYM} 未生效，会回落 EVB"
          grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config || true
          fail=1
        fi

        # ---------- 2) 关键包（缺了固件就白编）----------
        for p in airoha-pond airoha-ponctl kmod-airoha-xpon kmod-airoha-en7572 \
                 px5g-mbedtls luci-app-ddns \
                 openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server; do
          if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
            echo "  [ OK ]   关键包 $p"
          else
            echo "::error::关键包 $p 未生效（符号不存在或依赖未满足）"
            fail=1
          fi
        done

        # ---------- 3) socat 图形界面（第三方源，依赖 luci-compat 等）----------
        OPT_MISS=""
        for p in luci-app-socat; do
          grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config || OPT_MISS="$OPT_MISS $p"
        done
        if [ -n "$OPT_MISS" ]; then
          echo "::group::socat 图形界面依赖诊断"
          for p in luci-app-socat socat luci-compat luci-lua-runtime uhttpd-mod-lua; do
            if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
              echo "  [ OK ] $p"
            else
              echo "  [MISS] $p"
            fi
          done
          echo "::endgroup::"
            if [ "${REQUIRE_OPTIONAL}" = "true" ]; then
            echo "::error::socat 图形界面未生效:$OPT_MISS（把 build.yml 里 REQUIRE_OPTIONAL 改成 false 可跳过；或检查 diy-part1.sh 是否成功克隆 luci-app-socat）"
            fail=1
          else
            echo "::warning::socat 图形界面未生效:$OPT_MISS（继续编译）"
          fi
        fi

        echo "==================== 目标设备 ===================="
        grep -E '^CONFIG_TARGET_(MULTI_PROFILE|DEVICE)' .config || true

        echo "==================== 功能解析情况 ===================="
        for p in luci-app-pon luci-i18n-pon-zh-cn airoha-pon-debug \
                 luci-app-iptv zerotier luci-app-zerotier luci-app-wol \
                 ddns-go luci-app-ddns-go luci-app-ddns ddns-scripts \
                 socat luci-app-socat px5g-mbedtls \
                 openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server kmod-tun \
                 luci-theme-argon kmod-usb-storage kmod-fs-ext4 \
                 luci-app-filebrowser \
                 luci-app-package-manager ca-bundle; do
          if grep -qE "^CONFIG_PACKAGE_${p}=[ym]$" .config; then
            echo "  [ OK ]   $p"
          else
            echo "  [MISS]   $p  <- 符号不存在或依赖未满足，已被静默丢弃"
          fi
        done
        echo "===================================================="

        if [ "$fail" -ne 0 ]; then
          echo "::error::配置阶段断言未通过，提前终止（省掉 2 小时空编译）"
          exit 1
        fi
        echo "配置阶段断言全部通过"

    - name: SSH connection to Actions
      uses: P3TERX/ssh2actions@v1.0.0
      if: (github.event.inputs.ssh == 'true' && github.event.inputs.ssh != 'false') || contains(github.event.action, 'ssh')
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download package
      id: package
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        make -j4 V=s || make -j1 V=s

        shopt -s nullglob
        imgs=(bin/targets/airoha/an7581/*sysupgrade*)
        ls -lh bin/targets/airoha/an7581/ || true
        if [ ${#imgs[@]} -eq 0 ]; then
          echo "::error::没有生成 sysupgrade 固件"
          exit 1
        fi

        # 只取本设备的 manifest，别随手抓第一个
        M=""
        for f in bin/targets/airoha/an7581/*.manifest; do
          case "$f" in *nokia_xg-040g-md-ubi*) M="$f"; break;; esac
        done
        if [ -z "$M" ]; then
          M=$(ls bin/targets/airoha/an7581/*.manifest 2>/dev/null | head -n1 || true)
        fi

        {
          echo "=== 生成的文件 ==="
          ls -lh bin/targets/airoha/an7581/
          echo
          echo "=== manifest: ${M:-（无）} ==="
          if [ -n "$M" ]; then
            echo "--- pon / airoha / fit 相关行 ---"
            grep -inE 'fitblk|fit-check|pon|airoha' "$M" || echo "(无匹配行)"
            echo "--- ddns / socat / px5g / store / taskd 相关行 ---"
            grep -inE 'ddns|socat|px5g|store|taskd|ca-bundle|ca-certificates' "$M" || echo "(无匹配行)"
          fi
          echo
          echo "--- targets/packages 里 pon / fit 相关包 ---"
          ls bin/targets/airoha/an7581/packages/ 2>/dev/null | grep -iE 'fitblk|pon|airoha' || echo "(无匹配)"
        } | tee /tmp/pon-report.txt

        # 硬校验：4 个 PON 核心件必须在 manifest 里
        if [ -n "$M" ]; then
          HARD_MISS=""
          for p in airoha-pond airoha-ponctl kmod-airoha-xpon kmod-airoha-en7572; do
            grep -qE "^${p}([[:space:]]|-)" "$M" || HARD_MISS="$HARD_MISS $p"
          done
          if [ -n "$HARD_MISS" ]; then
            echo "::error::固件内缺少 PON 核心组件:$HARD_MISS"
            exit 1
          fi
          # 软校验：fitblk 是 HIDDEN:=1 的基础包，manifest 可能不列，不作为失败条件
          if grep -qE '^fitblk([[:space:]]|-)' "$M"; then
            echo "fitblk：已在 manifest 中"
          else
            echo "::warning::manifest 未列出 fitblk（隐藏基础包，常见现象，不影响 PON）"
          fi
        else
          echo "::warning::没有 .manifest，跳过 PON 校验（镜像已生成，照常上传）"
        fi

        # 软校验：本次新增/确认的组件是否真进了镜像（只告警，不判失败）
        if [ -n "$M" ]; then
          for p in px5g-mbedtls luci-app-ddns ddns-scripts socat \
                   luci-app-socat openvpn-openssl openvpn-easy-rsa luci-app-openvpn-server kmod-tun \
                   ca-bundle luci-app-package-manager; do
            if grep -qE "^${p}([[:space:]]|-)" "$M"; then
              echo "  [进包] $p"
            else
              echo "::warning::manifest 未见 $p（配置阶段若为 OK，多半是版本号行格式不同，可用 pon-report 复核）"
            fi
          done
        fi

        echo "PON 核心组件校验通过"
        echo "status=success" >> $GITHUB_OUTPUT

        grep -E '^CONFIG_TARGET_DEVICE_.*=y' .config | head -n1 | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

        echo "==================== 生成的固件 ===================="
        ls -lh "${imgs[@]}"
        echo "===================================================="

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload PON report
      uses: actions/upload-artifact@main
      if: always()
      with:
        name: pon-report${{ env.FILE_DATE }}
        path: /tmp/pon-report.txt

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: always() && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: PonWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        if-no-files-found: warn

    - name: Organize files
      id: organize
      if: always() && env.UPLOAD_FIRMWARE == 'true'
      run: |
        DIR=openwrt/bin/targets/airoha/an7581
        if [ ! -d "$DIR" ]; then
          echo "::warning::没有产物目录 $DIR"
          exit 0
        fi
        cd "$DIR"
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success'
      with:
        name: PonWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        if-no-files-found: warn

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success'
      run: |
        echo "release_tag=PonWrt-XG-040G-MD-$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@v1
      if: steps.tag.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: Remove old Releases
      if: env.UPLOAD_RELEASE == 'true' && steps.tag.outputs.status == 'success'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api "repos/${{ github.repository }}/releases?per_page=100" \
          --jq '.[] | select(.tag_name | startswith("PonWrt-XG-040G-MD-")) | .id' \
          | tail -n +6 | xargs -r -I{} gh api -X DELETE "repos/${{ github.repository }}/releases/{}"
